server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes: 
        - id: ms-products
          uri: lb://ms-products
          predicates:
            - Path=/api/products/**

        - id: ms-orders
          uri: lb://ms-orders
          predicates:
            - Path=/api/orders/**
    
        - id: ms-clients
          uri: lb://ms-clients
          predicates:
            - Path=/api/clients/**
      
        - id: ms-reports
          uri: lb://ms-reports
          predicates:
            - Path=/api/reports/**
      
        - id: ms-providers
          uri: lb://ms-providers
          predicates:
            - Path=/api/providers/**

        - id: ms-sellers
          uri: lb://ms-sellers
          predicates:
            - Path=/api/sellers/**

        - id: ms-purchases
          uri: lb://ms-purchases
          predicates:
            - Path=/api/purchases/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG